[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inspect-openreward"
version = "0.3.0"
description = "Run OpenReward environments through the Inspect eval platform"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "General Reasoning", email = "hello@gr.inc" }]
keywords = [
    "inspect-ai",
    "openreward",
    "evals",
    "llm",
    "agents",
    "reinforcement-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "inspect-ai>=0.3.205",
    "openreward>=0.1.115",
]

[project.urls]
Homepage = "https://github.com/OpenRewardAI/inspect-openreward"
Source = "https://github.com/OpenRewardAI/inspect-openreward"
Issues = "https://github.com/OpenRewardAI/inspect-openreward/issues"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inspect_openreward"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
