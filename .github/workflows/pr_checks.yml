name: "Pull request checks"

on:
  pull_request:
    branches:
      - "main"

jobs:
  version-check:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version is bumped
        uses: ./.github/workflows/check-pypi-version-bump
        with:
          package-name: inspect-openreward
