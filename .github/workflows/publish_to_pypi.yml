name: Publish to PyPI

on:
  push:
    branches:
      - "main"

jobs:
  version-check:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version is bumped
        uses: ./.github/workflows/check-pypi-version-bump
        with:
          pyproject-path: ./pyproject.toml
          package-name: inspect-openreward

  publish-to-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [version-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.11.7"
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - name: uv sync
        run: uv sync
      - name: Build
        run: uv build

      - name: Publish
        id: publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_KEY }}
        run: |
          uv publish
          VERSION=$(python3 -c "import tomllib; f=open('pyproject.toml','rb'); print(tomllib.load(f)['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
